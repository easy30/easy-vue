name: release

on:
  push:
    tags:
      - 'v*'          # 打 v1.0.0 这类 tag 时自动发版
  workflow_dispatch:  # 也允许在 Actions 界面手动触发

permissions:
  contents: write       # 上传 Release 资产所需

jobs:
  build:
    runs-on: macos-14   # macOS runner：用 zig 一次交叉编译出全部平台产物
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Setup Zig 0.13.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      # scriptc 用 SCRIPTC_CC=zigcc 调 zig。zigcc 必须是“调用 PATH 里的 zig”
      # 的 wrapper 脚本（等价 zig 自带的 zigcc），不能是 zig 二进制的软链：
      # win/build-win.sh 会劫持 PATH 里的 zig 来注入 POSIX shim，只有经
      # wrapper 重新按 PATH 解析 zig 才会命中该劫持。
      - name: Ensure zigcc alias
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v zigcc >/dev/null 2>&1; then
            printf '#!/bin/sh\nexec zig cc "$@"\n' > "$HOME/.local/bin/zigcc"
            chmod +x "$HOME/.local/bin/zigcc"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          zigcc --version

      - name: Prepare dist
        run: mkdir -p dist

      # --- 交叉编译各平台（全平台集中在 macOS 一台机器出目标） ---
      # 注：不再产「本机原生」easy-vue-bin —— 它与下方 zig 交叉的 x86_64-macos
      # (easy-vue-mac-intel) 同属 macOS x86_64，冗余。
      - name: Build macOS arm64
        run: SCRIPTC_CC=zigcc SCRIPTC_TARGET=aarch64-macos node_modules/.bin/scriptc build src/serve.ts --dynamic --backend c -o dist/easy-vue-mac-arm64

      - name: Build macOS intel (cross)
        run: SCRIPTC_CC=zigcc SCRIPTC_TARGET=x86_64-macos node_modules/.bin/scriptc build src/serve.ts --dynamic --backend c -o dist/easy-vue-mac-intel

      - name: Build Linux x86_64
        run: SCRIPTC_CC=zigcc SCRIPTC_TARGET=x86_64-linux-musl node_modules/.bin/scriptc build src/serve.ts --dynamic --backend c -o dist/easy-vue-linux

      - name: Build Linux arm64
        run: SCRIPTC_CC=zigcc SCRIPTC_TARGET=aarch64-linux-musl node_modules/.bin/scriptc build src/serve.ts --dynamic --backend c -o dist/easy-vue-linux-arm64

      # --- Windows（走 win/build-win.sh，内嵌 zigcc wrapper + POSIX shim） ---
      - name: Build Windows (x64 + arm64)
        run: ./win/build-win.sh all

      - name: Collect Windows artifacts
        run: mv bin/easy-vue-win-*.exe dist/

      # esbuild 配套：npm 官方已发布各平台静态 Go 二进制，直接下载，与对应 easy-vue
      # 二进制同目录打进 zip。easy-vue 会自动探测同目录 esbuild，部署解压即用。
      # 版本从 package.json 读取，保证与 easy-vue 内置的 esbuild 版本一致。
      # 注：macOS runner 默认 bash 3.2 不支持 declare -A 关联数组，故用 case 映射。
      - name: Bundle esbuild + easy-vue per platform into zips
        run: |
          set -euo pipefail
          ESB_VERSION="$(node -p "require('./package.json').dependencies.esbuild.replace(/^[\^~]/,'')")"
          echo "esbuild version: $ESB_VERSION"
          esb_pkg() { case "$1" in
            mac-arm64) echo darwin-arm64 ;; mac-intel) echo darwin-x64 ;;
            linux) echo linux-x64 ;; linux-arm64) echo linux-arm64 ;;
            win-x64) echo win32-x64 ;; win-arm64) echo win32-arm64 ;; esac; }
          bin_name() { case "$1" in win-*) echo easy-vue.exe ;; *) echo easy-vue ;; esac; }
          esb_name() { case "$1" in win-*) echo esbuild.exe ;; *) echo esbuild ;; esac; }
          # Windows 的 esbuild npm 包内二进制是 package/esbuild.exe；mac/linux 是 package/bin/esbuild
          esb_src() { case "$1" in
            win-*) echo "/tmp/bundle-${1}/package/esbuild.exe" ;;
            *) echo "/tmp/bundle-${1}/package/bin/esbuild" ;; esac; }
          src_name() { case "$1" in
            win-x64) echo dist/easy-vue-win-x64.exe ;; win-arm64) echo dist/easy-vue-win-arm64.exe ;;
            *) echo "dist/easy-vue-${1}" ;; esac; }
          for key in mac-arm64 mac-intel linux linux-arm64 win-x64 win-arm64; do
            pkg="$(esb_pkg "$key")"
            echo "== bundle $key ($pkg) =="
            curl -fsSL "https://registry.npmjs.org/@esbuild/${pkg}/-/${pkg}-${ESB_VERSION}.tgz" -o "/tmp/${key}.tgz"
            rm -rf "/tmp/bundle-${key}"
            mkdir -p "/tmp/bundle-${key}"
            tar xzf "/tmp/${key}.tgz" -C "/tmp/bundle-${key}"
            mv "$(esb_src "$key")" "/tmp/bundle-${key}/$(esb_name "$key")"
            chmod +x "/tmp/bundle-${key}/$(esb_name "$key")" || true
            # easy-vue 二进制（win 用 .exe，其余直接同名）+ 对应 esbuild，同目录
            cp "$(src_name "$key")" "/tmp/bundle-${key}/$(bin_name "$key")"
            chmod +x "/tmp/bundle-${key}/$(bin_name "$key")" || true
            rm -rf "/tmp/bundle-${key}/package"
            # 打 zip（zip 整个目录，避免因枚举不存在的文件而失败；package 残留已移除）
            ( cd "/tmp/bundle-${key}" && /usr/bin/zip -r "/tmp/easy-vue-${key}.zip" . >/dev/null )
            cp "/tmp/easy-vue-${key}.zip" dist/
          done
          ls -lh dist/*.zip

      - name: List artifacts
        run: ls -lh dist/

      # --- 只发布 zip 包（内含对应平台 easy-vue + esbuild，解压即用） ---
      # 不单独发布裸二进制：zip 里已含 easy-vue，避免冗余。
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/easy-vue-mac-arm64.zip
            dist/easy-vue-mac-intel.zip
            dist/easy-vue-linux.zip
            dist/easy-vue-linux-arm64.zip
            dist/easy-vue-win-x64.zip
            dist/easy-vue-win-arm64.zip
          generate_release_notes: true
